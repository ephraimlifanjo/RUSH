name: Package Desktop

on:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm install
      - run: python -m venv .venv
      - run: .venv\Scripts\python.exe -m pip install -U pip
        shell: pwsh
      - run: .venv\Scripts\python.exe -m pip install -r python\requirements.txt
        shell: pwsh
      - run: npm run check
      - run: .venv\Scripts\python.exe python\self_test.py
        shell: pwsh
      - run: npm run dist:win
        shell: pwsh
      - run: npm run dist:msi
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with: {name: rush-windows, path: desktop/release/*}

  linux:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential libarchive-tools rpm
      - run: npm install
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -U pip
      - run: .venv/bin/python -m pip install -r python/requirements.txt
      - run: npm run check
      - run: .venv/bin/python python/self_test.py
      - run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with: {name: rush-linux, path: desktop/release/*}

  macos:
    runs-on: macos-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: brew install cmake || true
      - run: npm install
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -U pip
      - run: .venv/bin/python -m pip install -r python/requirements.txt
      - run: npm run check
      - run: .venv/bin/python python/self_test.py
      - run: npm run dist:mac
      - uses: actions/upload-artifact@v4
        with: {name: rush-macos, path: desktop/release/*}
