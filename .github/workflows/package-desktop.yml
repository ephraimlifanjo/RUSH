name: Package Desktop

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/package-desktop.yml"
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    defaults:
      run:
        working-directory: desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with: {node-version: 22}
      - name: Set up Python
        uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install JavaScript dependencies
        run: npm install
      - name: Create Python environment
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -r python\requirements.txt
      - name: Validate Office Suite
        run: npm run check
      - name: Test PDF and document engine
        shell: pwsh
        run: .venv\Scripts\python.exe python\self_test.py
      - name: Build Windows EXE and MSI
        shell: pwsh
        run: npm run dist:windows:ci
      - name: Verify Windows installers
        shell: pwsh
        run: |
          $exe = Get-ChildItem release -File -Filter "RUSH-Office-Suite-2.1.2-*.exe"
          $msi = Get-ChildItem release -File -Filter "RUSH-Office-Suite-2.1.2-*.msi"
          if (-not $exe) { throw "RUSH 2.1.2 EXE was not produced." }
          if (-not $msi) { throw "RUSH 2.1.2 MSI was not produced." }
          $exe | Select-Object Name,Length | Format-Table
          $msi | Select-Object Name,Length | Format-Table
      - name: Upload Windows installers
        uses: actions/upload-artifact@v4
        with:
          name: rush-office-windows-2.1.2
          if-no-files-found: error
          retention-days: 30
          path: |
            desktop/release/RUSH-Office-Suite-2.1.2-*.exe
            desktop/release/RUSH-Office-Suite-2.1.2-*.msi
      - name: Publish GitHub Release
        shell: pwsh
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v2.1.2"
          $title = "RUSH Office Suite 2.1.2"
          $notes = @"
          RUSH Office Suite 2.1.2 corrective release for Windows x64.

          Fixes:
          - typing/caret no longer resets or drops characters
          - Save reads the live document DOM, including the last typed character
          - Inserted images can be selected, resized, aligned and removed
          - Images are embedded in DOCX and restored when reopening DOCX
          - Document-to-PDF export supports embedded images
          - PDF text/annotation/signature edits now have a real Save Edited PDF workflow
          - PDF, Document and Settings ribbon tabs are interactive
          - Split and PDF-to-images use folder outputs correctly

          Built and tested automatically from main.
          "@
          gh release view $tag --repo $env:GITHUB_REPOSITORY 2>$null
          if ($LASTEXITCODE -ne 0) { gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title $title --notes $notes }
          gh release upload $tag "desktop/release/RUSH-Office-Suite-2.1.2-x64.exe" "desktop/release/RUSH-Office-Suite-2.1.2-x64.msi" --repo $env:GITHUB_REPOSITORY --clobber
  linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential libarchive-tools rpm
      - run: npm install
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -U pip
      - run: .venv/bin/python -m pip install -r python/requirements.txt
      - run: npm run check
      - run: .venv/bin/python python/self_test.py
      - run: npm run dist:linux
  macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    defaults: {run: {working-directory: desktop}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: brew install cmake || true
      - run: npm install
      - run: python3 -m venv .venv
      - run: .venv/bin/python -m pip install -U pip
      - run: .venv/bin/python -m pip install -r python/requirements.txt
      - run: npm run check
      - run: .venv/bin/python python/self_test.py
      - run: npm run dist:mac
